name: Resolve Node version
description: >-
  Node version for a job: the nearest `node = "…"` pin in mise.toml or
  .mise.toml, searching from a directory up to the repo root, else a default.

# Called as `$/.github/actions/resolve-node-version`, which resolves to the
# workflow's own commit (`./` would be the caller's checkout). Needs runner
# 2.336.0+.

inputs:
  default:
    description: Version used when no mise config pins Node.
    required: true
  working-directory:
    description: >-
      Directory to search up from. Composite steps don't inherit the job's
      working-directory, so pass it.
    required: false
    default: "."

outputs:
  version:
    description: The resolved Node version.
    value: ${{ steps.resolve.outputs.version }}

runs:
  using: composite
  steps:
    # Nearest pin wins, as in mise itself.
    - id: resolve
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        DEFAULT_NODE_VERSION: ${{ inputs.default }}
      run: |
        version="$DEFAULT_NODE_VERSION"
        dir="$PWD"
        while :; do
          for f in "$dir/mise.toml" "$dir/.mise.toml"; do
            [ -f "$f" ] || continue
            pinned=$(sed -nE 's/^[[:space:]]*node[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$f" | head -1)
            if [ -n "$pinned" ]; then
              version="$pinned"
              echo "Using node $version from ${f#"$GITHUB_WORKSPACE"/}"
              break 2
            fi
          done
          [ "$dir" = "$GITHUB_WORKSPACE" ] || [ "$dir" = / ] && break
          dir=$(dirname "$dir")
        done
        echo "version=$version" >> "$GITHUB_OUTPUT"
