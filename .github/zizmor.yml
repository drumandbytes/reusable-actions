rules:
  unpinned-uses:
    config:
      policies:
        # GitHub's and our own actions on tags; third-party SHA-pinned.
        "actions/*": ref-pin
        "drumandbytes/*": ref-pin
        "*": hash-pin

  dangerous-triggers:
    ignore:
      # Needed for Dependabot merges; never checks out PR code.
      - dependabot-auto-merge.yml

  cache-poisoning:
    ignore:
      # Only the npm download cache, and `npm ci` verifies lockfile hashes.
      - deploy-cloudflare-pages.yml
      - deploy-cloudflare-worker.yml

  self-repository:
    ignore:
      # Self-tests use `./` (same commit here) so actionlint checks inputs.
      - ci.yml
