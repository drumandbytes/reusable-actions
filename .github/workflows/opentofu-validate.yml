name: OpenTofu validate

# fmt and validate for an OpenTofu root module. `init -backend=false` needs no
# credentials and never touches remote state.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Root module directory.
        required: false
        type: string
        default: "."
      tofu-version:
        description: OpenTofu version.
        required: false
        type: string
        default: "1.12.3"
      check-format:
        description: Run `tofu fmt -check -recursive`. Disable when a parent job already does.
        required: false
        type: boolean
        default: true
      runner:
        description: runs-on value.
        required: false
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  fmt:
    name: Format check
    if: inputs.check-format
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ inputs.tofu-version }}
      - run: tofu fmt -check -recursive
        working-directory: ${{ inputs.working-directory }}

  validate:
    name: Validate
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ inputs.tofu-version }}
      # Provider cache, keyed on the lock file.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/tofu-plugin-cache
          key: tofu-providers-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/.terraform.lock.hcl', inputs.working-directory)) }}
          restore-keys: tofu-providers-${{ runner.os }}-${{ runner.arch }}-
      - name: Init
        env:
          TF_PLUGIN_CACHE_DIR: ${{ runner.temp }}/tofu-plugin-cache
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          tofu init -backend=false
        working-directory: ${{ inputs.working-directory }}
      - run: tofu validate
        working-directory: ${{ inputs.working-directory }}
