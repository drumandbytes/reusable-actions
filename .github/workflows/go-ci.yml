name: Go CI

# Build, vet, gofmt, test, golangci-lint and optionally hadolint.

on:
  workflow_call:
    inputs:
      go-version:
        description: >-
          Go version. Empty reads go.mod, where `go 1.27.0` means exactly that
          patch; pass "1.27" for the latest 1.27.x.
        required: false
        type: string
        default: ""
      test-race:
        description: Run `go test` with the race detector.
        required: false
        type: boolean
        default: false
      run-golangci-lint:
        description: Run golangci-lint in a separate job.
        required: false
        type: boolean
        default: true
      golangci-lint-version:
        description: golangci-lint version.
        required: false
        type: string
        default: "latest"
      dockerfile-path:
        description: Dockerfile to lint with hadolint. Empty skips it.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build-test:
    name: Build, vet, test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-formatted (run gofmt -w .):"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test ${{ inputs.test-race && '-race' || '' }} ./...

  golangci-lint:
    name: golangci-lint
    if: inputs.run-golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ inputs.go-version }}
          go-version-file: ${{ inputs.go-version == '' && 'go.mod' || '' }}

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ inputs.golangci-lint-version }}

  hadolint:
    name: hadolint
    if: inputs.dockerfile-path != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: ${{ inputs.dockerfile-path }}
