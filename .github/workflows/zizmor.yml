name: zizmor

# Audits the caller's workflows; findings fail the job. Accept findings in
# .github/zizmor.yml or inline `# zizmor: ignore[...]`, with a reason.

on:
  workflow_call:
    inputs:
      min-severity:
        description: Lowest failing severity - informational, low, medium or high.
        required: false
        type: string
        default: "low"
      version:
        description: zizmor version. Pinned so a new release can't turn every caller red at once.
        required: false
        type: string
        default: "1.30.1"
      runner:
        description: runs-on value. Needs Docker.
        required: false
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
          min-severity: ${{ inputs.min-severity }}
          version: ${{ inputs.version }}
