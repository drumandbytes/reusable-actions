name: zizmor

# Security audit of a repository's GitHub Actions workflows (template
# injection, token and permission handling, unpinned third-party actions,
# cache poisoning...). Findings fail the job and are printed in the log --
# no SARIF upload, for the same reason as security-scan.yml.
#
# Accepted findings belong in the caller's .github/zizmor.yml (picked up
# automatically) or inline as `# zizmor: ignore[<audit>] -- <reason>`,
# always with the reason.

on:
  workflow_call:
    inputs:
      min-severity:
        description: >-
          Lowest severity that fails the job: informational, low, medium or
          high. Informational findings are style-level, so they are skipped
          by default.
        required: false
        type: string
        default: "low"
      version:
        description: >-
          zizmor version. Pinned so a new release's audits can't turn every
          caller red at once; bump deliberately.
        required: false
        type: string
        default: "1.30.1"
      runner:
        description: runs-on value for this workflow's job. Needs Docker.
        required: false
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          min-severity: ${{ inputs.min-severity }}
          version: ${{ inputs.version }}
