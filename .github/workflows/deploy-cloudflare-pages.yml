name: Deploy Cloudflare Pages

# Shared deploy for Cloudflare Pages sites. Defaults target the common case —
# a Vite-style app that installs with npm and builds to dist/ — so a typical
# caller only needs to pass project-name.
#
# Static sites that need no dependency install set install-dependencies: false
# and point output-directory at the sources.

on:
  workflow_call:
    inputs:
      project-name:
        description: Cloudflare Pages project name to deploy to.
        required: true
        type: string
      working-directory:
        description: Directory containing the site, relative to the repo root.
        required: false
        type: string
        default: "."
      install-dependencies:
        description: >-
          Run `npm ci` before building. Set false for static sites with no
          package-lock.json — `npm ci` hard-fails without one.
        required: false
        type: boolean
        default: true
      build-command:
        description: >-
          Shell command run before deploying, from working-directory. Set to an
          empty string to deploy the sources as-is.
        required: false
        type: string
        default: "npm run build"
      output-directory:
        description: >-
          Directory wrangler publishes, relative to working-directory. Use "."
          to publish the working directory itself.
        required: false
        type: string
        default: "dist"
      node-version:
        description: Node.js version used to install and build.
        required: false
        type: string
        default: "20"
      build-env:
        description: >-
          JSON object of environment variables exported before the build, for
          build-time config such as Vite's VITE_* values. The caller
          interpolates the values.
        required: false
        type: string
        default: "{}"
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.project-name }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        if: inputs.install-dependencies
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - if: inputs.install-dependencies
        run: npm ci

      - name: Build
        if: inputs.build-command != ''
        env:
          BUILD_ENV_JSON: ${{ inputs.build-env }}
        # build-env is passed through the environment and quoted with jq's @sh
        # before eval, so a value containing shell metacharacters cannot break
        # out of its assignment.
        run: |
          set -a
          eval "$(printf '%s' "$BUILD_ENV_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value|@sh)"')"
          set +a
          ${{ inputs.build-command }}

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ inputs.working-directory }}
          command: pages deploy ${{ inputs.output-directory }} --project-name=${{ inputs.project-name }}
