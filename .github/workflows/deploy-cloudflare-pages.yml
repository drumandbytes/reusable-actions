name: Deploy Cloudflare Pages

# Shared deploy for Cloudflare Pages sites. Defaults target the common case —
# a Vite-style app that installs with npm and builds to dist/ — so a typical
# caller only needs to pass project-name.
#
# Static sites that need no dependency install set install-dependencies: false
# and point output-directory at the sources.

on:
  workflow_call:
    inputs:
      project-name:
        description: Cloudflare Pages project name to deploy to.
        required: true
        type: string
      working-directory:
        description: Directory containing the site, relative to the repo root.
        required: false
        type: string
        default: "."
      install-dependencies:
        description: >-
          Run `npm ci` before building. Set false for static sites with no
          package-lock.json — `npm ci` hard-fails without one.
        required: false
        type: boolean
        default: true
      build-command:
        description: >-
          Shell command run before deploying, from working-directory. Set to an
          empty string to deploy the sources as-is.
        required: false
        type: string
        default: "npm run build"
      output-directory:
        description: >-
          Directory wrangler publishes, relative to working-directory. Use "."
          to publish the working directory itself.
        required: false
        type: string
        default: "dist"
      node-version:
        description: Node.js version used to install and build.
        required: false
        type: string
        default: "24"
      build-env:
        description: >-
          JSON object of environment variables exported before the build, for
          build-time config such as Vite's VITE_* values. The caller
          interpolates the values.
        required: false
        type: string
        default: "{}"
      runner:
        description: runs-on value for this workflow's job.
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.project-name }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    # Two quick merges would otherwise deploy side by side, and whichever
    # finishes last stays live -- possibly the older one. Queue per target and
    # ref instead: cancel-in-progress stays false so a deploy is never cut off
    # halfway, and GitHub keeps only the newest pending run. The ref keeps a
    # preview deploy from displacing a queued production one.
    concurrency:
      group: cloudflare-pages-deploy-${{ inputs.project-name }}-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve node version
        id: node
        # mise.toml is the source of truth for repos that have one, so a version
        # lives in exactly one place instead of being repeated in every workflow
        # that calls this. Falls back to the node-version input for the callers
        # that have no mise.toml -- most of them, so this must stay a fallback
        # rather than a requirement.
        #
        # Walks from the working directory up to the repo root, nearest node pin
        # wins -- the way mise itself resolves config, so a single root
        # mise.toml covers packages and workers living in subdirectories.
        env:
          DEFAULT_NODE_VERSION: ${{ inputs.node-version }}
        run: |
          version="$DEFAULT_NODE_VERSION"
          dir="$PWD"
          while :; do
            for f in "$dir/mise.toml" "$dir/.mise.toml"; do
              [ -f "$f" ] || continue
              pinned=$(sed -nE 's/^[[:space:]]*node[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$f" | head -1)
              if [ -n "$pinned" ]; then
                version="$pinned"
                echo "Using node $version from ${f#"$GITHUB_WORKSPACE"/}"
                break 2
              fi
            done
            [ "$dir" = "$GITHUB_WORKSPACE" ] || [ "$dir" = / ] && break
            dir=$(dirname "$dir")
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: inputs.install-dependencies
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - if: inputs.install-dependencies
        run: npm ci

      - name: Build
        if: inputs.build-command != ''
        env:
          BUILD_ENV_JSON: ${{ inputs.build-env }}
          BUILD_COMMAND: ${{ inputs.build-command }}
        # build-env is passed through the environment and quoted with jq's @sh
        # before eval, so a value containing shell metacharacters cannot break
        # out of its assignment. build-command is meant to run as shell, so it
        # is eval'd as-is -- through the environment only so an expression
        # expansion can't splice into the lines around it.
        run: |
          set -a
          eval "$(printf '%s' "$BUILD_ENV_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value|@sh)"')"
          set +a
          eval "$BUILD_COMMAND"

      - uses: cloudflare/wrangler-action@25853364521e0d392ece9b0c1e97a4b37b638087 # v4.1.2
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ inputs.working-directory }}
          command: pages deploy ${{ inputs.output-directory }} --project-name=${{ inputs.project-name }}
