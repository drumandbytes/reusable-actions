name: Deploy Cloudflare Pages

# Shared deploy for Cloudflare Pages sites. Defaults target the common case —
# a Vite-style app that installs with npm and builds to dist/ — so a typical
# caller only needs to pass project-name.
#
# Static sites that need no dependency install set install-dependencies: false
# and point output-directory at the sources.

on:
  workflow_call:
    inputs:
      project-name:
        description: Cloudflare Pages project name to deploy to.
        required: true
        type: string
      working-directory:
        description: Directory containing the site, relative to the repo root.
        required: false
        type: string
        default: "."
      install-dependencies:
        description: >-
          Run `npm ci` before building. Set false for static sites with no
          package-lock.json — `npm ci` hard-fails without one.
        required: false
        type: boolean
        default: true
      build-command:
        description: >-
          Shell command run before deploying, from working-directory. Set to an
          empty string to deploy the sources as-is.
        required: false
        type: string
        default: "npm run build"
      output-directory:
        description: >-
          Directory wrangler publishes, relative to working-directory. Use "."
          to publish the working directory itself.
        required: false
        type: string
        default: "dist"
      node-version:
        description: Node.js version used to install and build.
        required: false
        type: string
        default: "24"
      build-env:
        description: >-
          JSON object of environment variables exported before the build, for
          build-time config such as Vite's VITE_* values. The caller
          interpolates the values.
        required: false
        type: string
        default: "{}"
      runner:
        description: runs-on value for this workflow's job.
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.project-name }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    # Two quick merges would otherwise deploy side by side, and whichever
    # finishes last stays live -- possibly the older one. Queue per target and
    # ref instead: cancel-in-progress stays false so a deploy is never cut off
    # halfway, and GitHub keeps only the newest pending run. The ref keeps a
    # preview deploy from displacing a queued production one.
    concurrency:
      group: cloudflare-pages-deploy-${{ inputs.project-name }}-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve node version
        id: node
        uses: $/.github/actions/resolve-node-version
        with:
          default: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}

      # Always set up Node: wrangler needs it even when nothing is installed,
      # and a bare self-hosted runner has none (or some other version). Only
      # the npm cache depends on installing -- it hard-fails without a lockfile.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: ${{ inputs.install-dependencies && 'npm' || '' }}
          cache-dependency-path: ${{ inputs.install-dependencies && format('{0}/package-lock.json', inputs.working-directory) || '' }}

      - if: inputs.install-dependencies
        run: npm ci

      - name: Build
        if: inputs.build-command != ''
        env:
          BUILD_ENV_JSON: ${{ inputs.build-env }}
          BUILD_COMMAND: ${{ inputs.build-command }}
        # build-env is passed through the environment and quoted with jq's @sh
        # before eval, so a value containing shell metacharacters cannot break
        # out of its assignment. The jq output is captured first rather than
        # fed straight to eval: `eval "$(jq …)"` ignores a jq failure (missing
        # binary, malformed JSON) and would build without the variables,
        # deploying a broken site from a green job. As a plain assignment the
        # failure stops the job instead.
        #
        # build-command is meant to run as shell, so it is eval'd as-is --
        # through the environment only so an expression expansion can't
        # splice into the lines around it.
        run: |
          assignments=$(printf '%s' "$BUILD_ENV_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value|@sh)"')
          set -a
          eval "$assignments"
          set +a
          eval "$BUILD_COMMAND"

      - uses: cloudflare/wrangler-action@25853364521e0d392ece9b0c1e97a4b37b638087 # v4.1.2
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ inputs.working-directory }}
          command: pages deploy ${{ inputs.output-directory }} --project-name=${{ inputs.project-name }}
