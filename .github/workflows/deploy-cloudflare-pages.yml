name: Deploy Cloudflare Pages

on:
  workflow_call:
    inputs:
      project-name:
        description: Cloudflare Pages project name.
        required: true
        type: string
      working-directory:
        description: Directory containing the site.
        required: false
        type: string
        default: "."
      install-dependencies:
        description: Run `npm ci` first. Set false when there's no package-lock.json.
        required: false
        type: boolean
        default: true
      build-command:
        description: Build command, run in working-directory. Empty deploys the sources as-is.
        required: false
        type: string
        default: "npm run build"
      output-directory:
        description: Directory to publish, relative to working-directory.
        required: false
        type: string
        default: "dist"
      node-version:
        description: Node.js version, unless mise.toml pins one.
        required: false
        type: string
        default: "24"
      build-env:
        description: JSON object of environment variables for the build, e.g. VITE_* values.
        required: false
        type: string
        default: "{}"
      runner:
        description: runs-on value.
        required: false
        type: string
        default: "ubuntu-latest"
      sitemap-artifact:
        description: Upload the built sitemap*.xml files as an artifact with this name, for indexnow.yml.
        required: false
        type: string
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.project-name }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    # Queue rather than cancel, so an older deploy can't finish last and win.
    concurrency:
      group: cloudflare-pages-deploy-${{ inputs.project-name }}-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve node version
        id: node
        uses: $/.github/actions/resolve-node-version
        with:
          default: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}

      # No Actions cache on self-hosted runners: they keep ~/.npm between runs,
      # and restoring the cache there is slower than not.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: ${{ inputs.install-dependencies && runner.environment != 'self-hosted' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment != 'self-hosted' }}
          cache-dependency-path: ${{ inputs.install-dependencies && format('{0}/package-lock.json', inputs.working-directory) || '' }}

      - if: inputs.install-dependencies
        run: npm ci

      # @sh quotes each build-env value for eval. jq's output is assigned first
      # so a jq failure stops the job instead of building without the vars.
      - name: Build
        if: inputs.build-command != ''
        env:
          BUILD_ENV_JSON: ${{ inputs.build-env }}
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: |
          assignments=$(printf '%s' "$BUILD_ENV_JSON" | jq -r 'to_entries[] | "\(.key)=\(.value|@sh)"')
          set -a
          eval "$assignments"
          set +a
          eval "$BUILD_COMMAND"

      - if: inputs.sitemap-artifact != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.sitemap-artifact }}
          path: ${{ inputs.working-directory }}/${{ inputs.output-directory }}/**/sitemap*.xml
          if-no-files-found: error
          retention-days: 1

      - uses: cloudflare/wrangler-action@25853364521e0d392ece9b0c1e97a4b37b638087 # v4.1.2
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ inputs.working-directory }}
          command: pages deploy ${{ inputs.output-directory }} --project-name=${{ inputs.project-name }}
