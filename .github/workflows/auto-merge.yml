name: Auto merge

# Enables auto-merge on a PR once its CI run has passed.
#
# Triggered from a caller's `workflow_run` rather than `pull_request` on
# purpose: GitHub withholds Actions secrets and gives a read-only GITHUB_TOKEN
# to Dependabot-triggered runs, so a `pull_request`-based job cannot merge them.
# A `workflow_run` job executes in the base repository's context with full
# permissions, which is what makes this work for Dependabot at all.
#
# There is deliberately no "approve the PR" step. The org ruleset requires a
# pull request but zero approving reviews, so approval is unnecessary — and
# GitHub Actions is blocked from approving PRs org-wide
# (can_approve_pull_request_reviews = false), which is a deliberate hardening
# choice we do not want to reverse just to satisfy a decorative step.

on:
  workflow_call:
    inputs:
      allowed-authors:
        description: >-
          JSON array of PR authors eligible for auto-merge no matter what
          they change. Defaults to Dependabot only. Widening this on a
          public repository would auto-merge outside contributions — do not
          do that casually.
        required: false
        type: string
        default: '["dependabot[bot]"]'
      patch-only-authors:
        description: >-
          JSON array of PR authors eligible for auto-merge only when
          .release-please-manifest.json's root (".") version is a patch bump
          (major.minor unchanged) over the base branch. A minor/major bump
          is left for manual review. For release-please's PR author.
        required: false
        type: string
        default: '[]'
      merge-method:
        description: One of squash, merge, rebase.
        required: false
        type: string
        default: squash
      use-app-token-for-merge:
        description: >-
          Merge with a GitHub App installation token (DNB_ROBOT_CLIENT_ID /
          AUTOMATION_APP_PRIVATE_KEY, both required if this is true) instead of
          GITHUB_TOKEN. GitHub deliberately excludes GITHUB_TOKEN-authored
          pushes from triggering further workflow runs — harmless for a plain
          Dependabot merge, but it means a merged release-please PR never
          re-triggers release-please to actually cut the tag/release, leaving
          the manifest/changelog bumped with nothing built. Off by default:
          every existing caller keeps today's behavior unless it opts in.
        required: false
        type: boolean
        default: false
    secrets:
      DNB_ROBOT_CLIENT_ID:
        required: false
      AUTOMATION_APP_PRIVATE_KEY:
        required: false

jobs:
  auto-merge:
    name: Auto merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Resolve PR and check author
        id: pr
        uses: actions/github-script@v9
        env:
          ALLOWED_AUTHORS: ${{ inputs.allowed-authors }}
          PATCH_ONLY_AUTHORS: ${{ inputs.patch-only-authors }}
        with:
          script: |
            const run = context.payload.workflow_run;
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${run.head_repository.owner.login}:${run.head_branch}`,
            });
            if (prs.data.length === 0) {
              core.info('No open PR for this branch; nothing to merge.');
              core.setOutput('eligible', 'false');
              return;
            }
            const pr = prs.data[0];

            const setEligible = (ok, reason) => {
              core.info(`PR #${pr.number} by ${pr.user.login}: ${reason}`);
              core.setOutput('eligible', ok ? 'true' : 'false');
              if (ok) core.setOutput('number', String(pr.number));
            };

            const allowed = JSON.parse(process.env.ALLOWED_AUTHORS);
            if (allowed.includes(pr.user.login)) {
              return setEligible(true, 'author is unconditionally allowed');
            }

            const patchOnly = JSON.parse(process.env.PATCH_ONLY_AUTHORS);
            if (!patchOnly.includes(pr.user.login)) {
              return setEligible(false, `author is not in allowed-authors (${JSON.stringify(allowed)}) or patch-only-authors (${JSON.stringify(patchOnly)})`);
            }

            // release-please keeps this file's root (".") version in sync
            // with the PR title as it force-pushes over the life of the PR,
            // so diffing it base vs. head is a stable way to size the bump
            // without parsing the title.
            const versionAt = async (ref) => {
              const { data } = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path: '.release-please-manifest.json',
                ref,
              });
              return JSON.parse(Buffer.from(data.content, 'base64').toString())['.'];
            };
            const [oldVersion, newVersion] = await Promise.all([
              versionAt(pr.base.sha),
              versionAt(pr.head.sha),
            ]);
            const [oldMajor, oldMinor] = oldVersion.split('.').map(Number);
            const [newMajor, newMinor] = newVersion.split('.').map(Number);
            const isPatch = oldMajor === newMajor && oldMinor === newMinor;
            setEligible(isPatch, `${oldVersion} -> ${newVersion} is ${isPatch ? 'a patch bump' : 'a minor/major bump, needs manual review'}`);

      - name: Mint app token for merge
        if: steps.pr.outputs.eligible == 'true' && inputs.use-app-token-for-merge
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DNB_ROBOT_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - name: Enable auto-merge
        if: steps.pr.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ inputs.use-app-token-for-merge && steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          MERGE_METHOD: ${{ inputs.merge-method }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        # Values are passed through the environment rather than interpolated
        # into the command, so a caller cannot inject shell.
        run: |
          case "$MERGE_METHOD" in
            squash|merge|rebase) ;;
            *) echo "::error::invalid merge-method: $MERGE_METHOD"; exit 1 ;;
          esac
          gh pr merge "$PR_NUMBER" --auto "--$MERGE_METHOD" --repo "$GITHUB_REPOSITORY"
