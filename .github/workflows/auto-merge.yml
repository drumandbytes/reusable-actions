name: Auto merge

# Enables auto-merge on a PR once its CI run has passed.
#
# Callers trigger this from workflow_run, not pull_request: Dependabot's
# pull_request runs get no secrets and a read-only token, so they can't merge.
# No approve step: the ruleset needs no approvals, and Actions can't approve
# PRs in this org.

on:
  workflow_call:
    inputs:
      allowed-authors:
        description: >-
          JSON array of PR authors merged whatever they change. Don't widen
          this on a public repo; it would auto-merge outside contributions.
        required: false
        type: string
        default: '["dependabot[bot]"]'
      patch-only-authors:
        description: >-
          JSON array of PR authors merged only when .release-please-manifest.json's
          root version is a patch bump. For release-please's PRs.
        required: false
        type: string
        default: '[]'
      merge-method:
        description: squash, merge or rebase.
        required: false
        type: string
        default: squash
      use-app-token-for-merge:
        description: >-
          Merge with the dnb-robot app token (needs both secrets) instead of
          GITHUB_TOKEN. A GITHUB_TOKEN merge triggers no workflows, so a merged
          release PR would never cut its release.
        required: false
        type: boolean
        default: false
      runner:
        description: runs-on value.
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      DNB_ROBOT_CLIENT_ID:
        required: false
      AUTOMATION_APP_PRIVATE_KEY:
        required: false

jobs:
  auto-merge:
    name: Auto merge
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Resolve PR and check author
        id: pr
        uses: actions/github-script@v9
        env:
          ALLOWED_AUTHORS: ${{ inputs.allowed-authors }}
          PATCH_ONLY_AUTHORS: ${{ inputs.patch-only-authors }}
        with:
          script: |
            const run = context.payload.workflow_run;
            const prs = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${run.head_repository.owner.login}:${run.head_branch}`,
            });
            // Match the commit CI ran on: if the head has moved on, that
            // newer run decides.
            const pr = prs.data.find((p) => p.head.sha === run.head_sha);
            if (!pr) {
              core.info(prs.data.length === 0
                ? 'No open PR for this branch; nothing to merge.'
                : `No open PR at ${run.head_sha} (head has moved on); the CI run for the new head decides.`);
              core.setOutput('eligible', 'false');
              return;
            }

            const setEligible = (ok, reason) => {
              core.info(`PR #${pr.number} by ${pr.user.login}: ${reason}`);
              core.setOutput('eligible', ok ? 'true' : 'false');
              if (ok) core.setOutput('number', String(pr.number));
            };

            const allowed = JSON.parse(process.env.ALLOWED_AUTHORS);
            if (allowed.includes(pr.user.login)) {
              return setEligible(true, 'author is unconditionally allowed');
            }

            const patchOnly = JSON.parse(process.env.PATCH_ONLY_AUTHORS);
            if (!patchOnly.includes(pr.user.login)) {
              return setEligible(false, `author is not in allowed-authors (${JSON.stringify(allowed)}) or patch-only-authors (${JSON.stringify(patchOnly)})`);
            }

            // Size the bump from the manifest's root version, base vs head.
            const versionAt = async (ref) => {
              try {
                const { data } = await github.rest.repos.getContent({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  path: '.release-please-manifest.json',
                  ref,
                });
                return JSON.parse(Buffer.from(data.content, 'base64').toString())['.'];
              } catch (e) {
                if (e.status === 404) return undefined;
                throw e;
              }
            };
            const [oldVersion, newVersion] = await Promise.all([
              versionAt(pr.base.sha),
              versionAt(pr.head.sha),
            ]);
            if (!oldVersion || !newVersion) {
              return setEligible(false, 'no root (".") version in .release-please-manifest.json on base or head; needs manual review');
            }
            const [oldMajor, oldMinor] = oldVersion.split('.').map(Number);
            const [newMajor, newMinor] = newVersion.split('.').map(Number);
            const isPatch = oldMajor === newMajor && oldMinor === newMinor;
            setEligible(isPatch, `${oldVersion} -> ${newVersion} is ${isPatch ? 'a patch bump' : 'a minor/major bump, needs manual review'}`);

      - name: Mint app token for merge
        if: steps.pr.outputs.eligible == 'true' && inputs.use-app-token-for-merge
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.DNB_ROBOT_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          # workflows: needed to merge PRs that touch workflow files.
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write

      - name: Enable auto-merge
        if: steps.pr.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ inputs.use-app-token-for-merge && steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          MERGE_METHOD: ${{ inputs.merge-method }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          case "$MERGE_METHOD" in
            squash|merge|rebase) ;;
            *) echo "::error::invalid merge-method: $MERGE_METHOD"; exit 1 ;;
          esac
          gh pr merge "$PR_NUMBER" --auto "--$MERGE_METHOD" --repo "$GITHUB_REPOSITORY"
