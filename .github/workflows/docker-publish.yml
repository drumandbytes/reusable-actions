name: Docker publish

# Multi-arch image to GHCR with SLSA build provenance. One job: for Go and
# other cross-compiling Dockerfiles (FROM --platform=$BUILDPLATFORM), arm64
# needs no QEMU and builds about as fast as amd64.

on:
  workflow_call:
    inputs:
      image:
        description: Image name without tag. Empty means ghcr.io/<owner>/<repo>, lowercased.
        required: false
        type: string
        default: ""
      context:
        description: Build context.
        required: false
        type: string
        default: "."
      platforms:
        description: Comma-separated target platforms.
        required: false
        type: string
        default: linux/amd64,linux/arm64
      tags:
        description: docker/metadata-action `tags` rules.
        required: false
        type: string
        default: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha,format=long
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
      runner:
        required: false
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  publish:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore OIDC for build provenance
      attestations: write # record the attestation on the repo
      artifact-metadata: write # storage record for the pushed image

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve image name
        id: image
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          [ -n "$IMAGE" ] || IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
        shell: bash

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: ${{ inputs.tags }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: ${{ inputs.context }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Stored next to the image in GHCR. Verify with:
      #   gh attestation verify oci://<image>:latest --owner <owner>
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
