name: Docker publish

# Multi-arch image to GHCR with SLSA build provenance. One job: for Go and
# other cross-compiling Dockerfiles (FROM --platform=$BUILDPLATFORM), arm64
# needs no QEMU and builds about as fast as amd64.
#
# On a self-hosted runner it builds with dockerd's own builder, whose layer
# cache stays on the VM (capped at 20 GB afterwards). That builder does one
# platform only, so pass `platforms: linux/amd64` there. Private repos get no
# attestation: artifact attestations need GitHub Enterprise Cloud for them.

on:
  workflow_call:
    inputs:
      image:
        description: Image name without tag. Empty means ghcr.io/<owner>/<repo>, lowercased.
        required: false
        type: string
        default: ""
      context:
        description: Build context.
        required: false
        type: string
        default: "."
      file:
        description: Dockerfile path. Empty means <context>/Dockerfile.
        required: false
        type: string
        default: ""
      target:
        description: Build stage to stop at. Empty builds the last stage.
        required: false
        type: string
        default: ""
      push:
        description: Push and attest the image. false only builds it, e.g. on pull requests.
        required: false
        type: boolean
        default: true
      platforms:
        description: Comma-separated target platforms.
        required: false
        type: string
        default: linux/amd64,linux/arm64
      tags:
        description: docker/metadata-action `tags` rules.
        required: false
        type: string
        default: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha,format=long
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
      runner:
        required: false
        type: string
        default: ubuntu-latest

permissions:
  contents: read

jobs:
  publish:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write # Sigstore OIDC for build provenance
      attestations: write # record the attestation on the repo
      artifact-metadata: write # storage record for the pushed image

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve image name
        id: image
        env:
          IMAGE: ${{ inputs.image }}
        run: |
          [ -n "$IMAGE" ] || IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "name=$IMAGE" >> "$GITHUB_OUTPUT"
        shell: bash

      # Self-hosted runners already have buildx with dockerd's `default` builder (the
      # docker driver) selected; setting it up again costs ~15 s per job.
      - if: runner.environment != 'self-hosted'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: docker-container
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          tags: ${{ inputs.tags }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        env:
          # The build record export and job summary cost a few seconds and nobody reads them.
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          # dockerd's builder can't store buildx's provenance manifest
          provenance: ${{ runner.environment == 'self-hosted' && 'false' || '' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Stored next to the image in GHCR. Verify with:
      #   gh attestation verify oci://<image>:latest --owner <owner>
      - uses: actions/attest-build-provenance@v4
        if: inputs.push && !github.event.repository.private
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Clean self-hosted runner Docker storage
        if: always() && runner.environment == 'self-hosted'
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          docker container prune --force
          # Drop what this job tagged, then dangling layers. Base and service images (postgres,
          # ...) stay: `image prune --all` evicted them, so the next build or CI job on this VM
          # pulled them again (a 1 GB postgres image took 40 s+).
          printf '%s\n' "$TAGS" | xargs -r docker rmi 2>/dev/null || true
          docker image prune --force
          docker volume prune --force
          # Other repos' builds reuse this VM's build cache; cap it, don't wipe it.
          docker buildx prune --builder default --force --max-used-space 20GB
          docker system df
        shell: bash
