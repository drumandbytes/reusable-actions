name: Release Please

# Expects release-please-config.json and .release-please-manifest.json at the
# caller's repo root.

on:
  workflow_call:
    inputs:
      move-floating-tags:
        description: Move the vN and vN.M tags to each new release, for repos consumed as `@v1`.
        required: false
        type: boolean
        default: false
      runner:
        description: runs-on value.
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      DNB_ROBOT_CLIENT_ID:
        required: true
      AUTOMATION_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      # dnb-robot, not GITHUB_TOKEN: only the app bypasses the main ruleset
      # (dnb-tf rulesets.tf). issues: for release-please's labels.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.DNB_ROBOT_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # No checkout here, so move the tags through the API.
      - if: ${{ inputs.move-floating-tags && steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.release.outputs.sha }}
          MAJOR: ${{ steps.release.outputs.major }}
          MINOR: ${{ steps.release.outputs.minor }}
        run: |
          for ALIAS in "v${MAJOR}" "v${MAJOR}.${MINOR}"; do
            gh api -X PATCH "repos/${REPO}/git/refs/tags/${ALIAS}" -f sha="${SHA}" -F force=true \
              || gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/tags/${ALIAS}" -f sha="${SHA}"
          done
