name: Release Please

# Cuts semver releases from Conventional Commits: opens/updates a release PR
# with the version bump and CHANGELOG.md, then tags + publishes a GitHub
# Release once that PR is merged. Expects release-please-config.json and
# .release-please-manifest.json in the calling repo's root.

on:
  workflow_call:
    inputs:
      move-floating-tags:
        description: >-
          Move vN/vN.M convenience tags onto every new release. Only needed by
          repos consumed as a reusable GitHub Action pinned like `@v1`.
        required: false
        type: boolean
        default: false
    secrets:
      DNB_ROBOT_CLIENT_ID:
        required: true
      AUTOMATION_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # dnb-robot App token, not GITHUB_TOKEN: the release PR merge and the tag
      # pushes have to get past protecting-main's ruleset, which only bypasses
      # for this installed App (see drumandbytes/dnb-tf rulesets.tf).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.DNB_ROBOT_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Consumers pin this repo's own release (or a caller's own tag) and
      # expect vN/vN.M to follow patches/minors. This job has no checkout, so
      # retarget the refs through the API. v5 root-component outputs are
      # bare, not '.--'-prefixed.
      - if: ${{ inputs.move-floating-tags && steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.release.outputs.sha }}
          MAJOR: ${{ steps.release.outputs.major }}
          MINOR: ${{ steps.release.outputs.minor }}
        run: |
          for ALIAS in "v${MAJOR}" "v${MAJOR}.${MINOR}"; do
            gh api -X PATCH "repos/${REPO}/git/refs/tags/${ALIAS}" -f sha="${SHA}" -F force=true \
              || gh api -X POST "repos/${REPO}/git/refs" -f ref="refs/tags/${ALIAS}" -f sha="${SHA}"
          done
