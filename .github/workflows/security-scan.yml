name: Security scan

# Trivy scan of the source tree (fs) or of a locally built image (image).
# Findings fail the job. No SARIF upload: code scanning on private repos
# needs GitHub Advanced Security, which the org doesn't pay for.

on:
  workflow_call:
    inputs:
      scan-type:
        description: '"fs" scans the source tree; "image" builds the Dockerfile and scans the image.'
        required: false
        type: string
        default: "fs"
      scan-ref:
        description: 'fs only: path to scan.'
        required: false
        type: string
        default: "."
      image-context:
        description: 'image only: build context.'
        required: false
        type: string
        default: "."
      dockerfile:
        description: 'image only: Dockerfile path.'
        required: false
        type: string
        default: "Dockerfile"
      skip-files:
        description: 'image only: comma-separated in-image paths to skip, e.g. vendored binaries.'
        required: false
        type: string
        default: ""
      scanners:
        description: 'fs only: comma-separated Trivy scanners.'
        required: false
        type: string
        default: "vuln,secret,misconfig"
      severity:
        description: Severities that fail the build.
        required: false
        type: string
        default: "CRITICAL,HIGH"
      ignore-unfixed:
        description: Skip vulnerabilities with no fix available.
        required: false
        type: boolean
        default: true
      skip-dirs:
        description: 'fs only: comma-separated directories to skip.'
        required: false
        type: string
        default: ""
      runner:
        description: runs-on value.
        required: false
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      # Any other value would skip the scan and pass green.
      - name: Validate scan-type
        env:
          SCAN_TYPE: ${{ inputs.scan-type }}
        run: |
          case "$SCAN_TYPE" in
            fs|image) ;;
            *) echo "::error::scan-type must be \"fs\" or \"image\", got \"$SCAN_TYPE\""; exit 1 ;;
          esac

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - if: inputs.scan-type == 'image'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image to scan
        if: inputs.scan-type == 'image'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.image-context }}
          file: ${{ inputs.dockerfile }}
          load: true
          tags: trivy-scan:latest
          cache-from: type=gha,scope=${{ github.workflow }}-${{ github.job }}-${{ runner.arch }}
          # Written from the default branch only, so PR runs don't fill the
          # 10 GB cache quota. PRs still read it.
          cache-to: ${{ github.ref_name == github.event.repository.default_branch && format('type=gha,mode=max,scope={0}-{1}-{2}', github.workflow, github.job, runner.arch) || '' }}

      # On self-hosted runners the vulnerability DB lives in the tool cache,
      # which survives between jobs; the Actions cache is slower to restore.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: ${{ inputs.scan-type }}
          scan-ref: ${{ inputs.scan-ref }}
          image-ref: ${{ inputs.scan-type == 'image' && 'trivy-scan:latest' || '' }}
          scanners: ${{ inputs.scan-type == 'fs' && inputs.scanners || '' }}
          skip-dirs: ${{ inputs.scan-type == 'fs' && inputs.skip-dirs || '' }}
          skip-files: ${{ inputs.scan-type == 'image' && inputs.skip-files || '' }}
          severity: ${{ inputs.severity }}
          ignore-unfixed: ${{ inputs.ignore-unfixed }}
          format: table
          exit-code: "1"
          cache: ${{ runner.environment != 'self-hosted' }}
          cache-dir: ${{ runner.environment == 'self-hosted' && format('{0}/trivy', runner.tool_cache) || format('{0}/.cache/trivy', github.workspace) }}

      - name: Clean self-hosted runner Docker storage
        if: ${{ always() && runner.environment == 'self-hosted' }}
        run: |
          docker system prune --all --force --volumes
          docker volume prune --all --force
          docker buildx prune --all --force
          docker system df
