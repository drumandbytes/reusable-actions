name: Security scan

# Trivy-based scanning, either of the source tree (dependency vulnerabilities,
# committed secrets, IaC misconfigurations) or of a built container image
# (OS packages plus the same dependency scanning, layered on top of whatever
# base image was chosen).
#
# Findings fail the job and are printed as a table in the log. Results are
# deliberately NOT uploaded as SARIF to GitHub code scanning: that requires
# GitHub Code Security / Advanced Security on private repositories, which this
# org does not pay for. Failing the build gives the same protection with no
# billable surface, and behaves identically on public and private repos.

on:
  workflow_call:
    inputs:
      scan-type:
        description: >-
          "fs" scans the checked-out source tree. "image" builds an image
          locally (not pushed) and scans that instead - use this for a
          Dockerfile, where the real risk surface is the base image and
          installed OS packages, not the source tree.
        required: false
        type: string
        default: "fs"
      scan-ref:
        description: 'fs only: path to scan, relative to the repository root.'
        required: false
        type: string
        default: "."
      image-context:
        description: 'image only: build context passed to docker/build-push-action.'
        required: false
        type: string
        default: "."
      dockerfile:
        description: 'image only: path to the Dockerfile to build and scan.'
        required: false
        type: string
        default: "Dockerfile"
      skip-files:
        description: >-
          image only: comma-separated in-image paths to exclude, e.g. for
          vendored/closed-source binaries whose embedded dependencies you have
          no way to act on regardless of what Trivy finds in them.
        required: false
        type: string
        default: ""
      scanners:
        description: >-
          Comma-separated Trivy scanners. "vuln" finds vulnerable dependencies,
          "secret" finds committed credentials, "misconfig" finds IaC
          misconfigurations (Terraform/OpenTofu, Dockerfiles, k8s manifests) -
          fs scans only, not meaningful against a built image.
        required: false
        type: string
        default: "vuln,secret,misconfig"
      severity:
        description: Severities that fail the build. Lower ones are not reported.
        required: false
        type: string
        default: "CRITICAL,HIGH"
      ignore-unfixed:
        description: >-
          Skip vulnerabilities that have no fix available yet. Keeps the signal
          actionable rather than reporting things you cannot do anything about.
        required: false
        type: boolean
        default: true
      skip-dirs:
        description: 'fs only: comma-separated directories to exclude from the scan.'
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - if: inputs.scan-type == 'image'
        uses: docker/setup-buildx-action@v4.3.0

      - name: Build image to scan
        if: inputs.scan-type == 'image'
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ inputs.image-context }}
          file: ${{ inputs.dockerfile }}
          load: true
          tags: trivy-scan:latest

      - if: inputs.scan-type == 'fs'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: ${{ inputs.scan-ref }}
          scanners: ${{ inputs.scanners }}
          severity: ${{ inputs.severity }}
          ignore-unfixed: ${{ inputs.ignore-unfixed }}
          skip-dirs: ${{ inputs.skip-dirs }}
          format: table
          exit-code: "1"

      - if: inputs.scan-type == 'image'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: trivy-scan:latest
          skip-files: ${{ inputs.skip-files }}
          severity: ${{ inputs.severity }}
          ignore-unfixed: ${{ inputs.ignore-unfixed }}
          format: table
          exit-code: "1"
