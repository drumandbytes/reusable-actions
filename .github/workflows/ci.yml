name: CI

# No paths-ignore: a filtered-out run never reports required-checks-passed,
# which the org ruleset requires, so the PR could never merge.

on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Dependabot can't see this pin; bump by hand.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"

      # actionlint doesn't know `$/` yet; drop the ignore once it does.
      - run: ./actionlint -color -ignore 'action "\$/[^"]*" in invalid format'

  zizmor:
    name: zizmor
    uses: ./.github/workflows/zizmor.yml

  # Self-tests: the PR's own workflows (local ./ paths) against tests/fixtures/.

  test-resolve-node-version:
    name: Test resolve-node-version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The pin is one level up in tests/fixtures/mise.toml, so this tests the walk up.
      - id: pinned
        uses: $/.github/actions/resolve-node-version
        with:
          default: "24"
          working-directory: tests/fixtures/node
      - id: fallback
        uses: $/.github/actions/resolve-node-version
        with:
          default: "24"
          working-directory: .github
      - env:
          PINNED: ${{ steps.pinned.outputs.version }}
          FALLBACK: ${{ steps.fallback.outputs.version }}
        run: |
          [ "$PINNED" = 22 ] || { echo "::error::expected 22 from tests/fixtures/mise.toml, got '$PINNED'"; exit 1; }
          [ "$FALLBACK" = 24 ] || { echo "::error::expected the default 24, got '$FALLBACK'"; exit 1; }

  test-node-ci:
    name: Test node-ci
    uses: ./.github/workflows/node-ci.yml
    with:
      lint-directory: tests/fixtures/node
      packages: '[{"directory": "tests/fixtures/node", "command": "npm test"}]'

  test-opentofu-validate:
    name: Test opentofu-validate
    uses: ./.github/workflows/opentofu-validate.yml
    with:
      working-directory: tests/fixtures/tofu

  test-security-scan-fs:
    name: Test security-scan (fs)
    uses: ./.github/workflows/security-scan.yml
    with:
      scan-ref: tests/fixtures

  test-security-scan-image:
    name: Test security-scan (image)
    uses: ./.github/workflows/security-scan.yml
    with:
      scan-type: image
      image-context: tests/fixtures/image
      dockerfile: tests/fixtures/image/Dockerfile

  # The one name the ruleset requires, however the jobs above change.
  required-checks-passed:
    name: Required checks passed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - actionlint
      - zizmor
      - test-resolve-node-version
      - test-node-ci
      - test-opentofu-validate
      - test-security-scan-fs
      - test-security-scan-image
    if: always()
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
