name: CI

# This repo's actual content is its workflow_call definitions - every file
# in workflows/ is a reusable workflow other repos consume, not something
# that runs here directly. actionlint validates that YAML/expression syntax
# (including workflow_call inputs/outputs) so a broken definition is caught
# here, not silently in every consuming repo's next run.

on:
  pull_request:
    branches: [main]

# No paths-ignore here on purpose: this workflow hosts required-checks-passed,
# which the org's branch ruleset requires by name on every PR. A path filter
# on the workflow trigger means GitHub never even starts the run for an
# excluded diff (e.g. a docs-only PR) -- not "skipped", just never reported --
# so the ruleset's required check sits at "Expected" forever and the PR can't
# merge. Filter what runs inside jobs (paths-filter, changed-files, etc.) if
# needed, never the trigger.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Pinned rather than fetched from actionlint's main branch, which would
      # run whatever script is there today. Dependabot can't see this one --
      # bump the version by hand.
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "$ACTIONLINT_VERSION"

      # actionlint (as of 1.7.12) predates GitHub's `$/` self-repository
      # syntax and rejects it as a malformed action reference. Ignore exactly
      # that message; drop the flag once actionlint supports `$/`.
      - run: ./actionlint -color -ignore 'action "\$/[^"]*" in invalid format'

  # Security audit of the workflow definitions themselves (injection, token
  # handling, unpinned third-party actions). Every org repo runs this code,
  # so it is checked here rather than in each caller. Accepted findings are
  # documented in .github/zizmor.yml. No SARIF upload, same reasoning as
  # security-scan.yml: fail the job and print the findings.
  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          # Pinned so a new zizmor audit can't turn an unrelated PR red.
          version: 1.30.1

  # --- Self-tests -----------------------------------------------------------
  # Linting alone can't show a reusable workflow actually works. These run the
  # PR's own copies (local ./ paths, not the released @v1) against the minimal
  # projects in tests/fixtures/. Deploys, go-ci and python-action-ci aren't
  # covered: the first need Cloudflare secrets, the others take no
  # subdirectory input to point at a fixture.

  test-resolve-node-version:
    name: Test resolve-node-version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The pin sits in tests/fixtures/mise.toml, one level above the start
      # directory, so this only passes if the lookup walks up.
      - id: pinned
        uses: $/.github/actions/resolve-node-version
        with:
          default: "24"
          working-directory: tests/fixtures/node
      # No mise config anywhere between .github/ and the repo root.
      - id: fallback
        uses: $/.github/actions/resolve-node-version
        with:
          default: "24"
          working-directory: .github
      - env:
          PINNED: ${{ steps.pinned.outputs.version }}
          FALLBACK: ${{ steps.fallback.outputs.version }}
        run: |
          [ "$PINNED" = 22 ] || { echo "::error::expected 22 from tests/fixtures/mise.toml, got '$PINNED'"; exit 1; }
          [ "$FALLBACK" = 24 ] || { echo "::error::expected the default 24, got '$FALLBACK'"; exit 1; }
          echo "pinned=$PINNED fallback=$FALLBACK"

  test-node-ci:
    name: Test node-ci
    uses: ./.github/workflows/node-ci.yml
    with:
      lint-directory: tests/fixtures/node
      # index.js exits non-zero unless Node came from tests/fixtures/mise.toml.
      packages: '[{"directory": "tests/fixtures/node", "command": "npm test"}]'

  test-opentofu-validate:
    name: Test opentofu-validate
    uses: ./.github/workflows/opentofu-validate.yml
    with:
      working-directory: tests/fixtures/tofu

  test-security-scan-fs:
    name: Test security-scan (fs)
    uses: ./.github/workflows/security-scan.yml
    with:
      scan-ref: tests/fixtures

  test-security-scan-image:
    name: Test security-scan (image)
    uses: ./.github/workflows/security-scan.yml
    with:
      scan-type: image
      image-context: tests/fixtures/image
      dockerfile: tests/fixtures/image/Dockerfile

  # Single stable name for the org's required-status-check ruleset to point
  # at, regardless of how the real jobs above are split or renamed.
  required-checks-passed:
    name: Required checks passed
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs:
      - actionlint
      - zizmor
      - test-resolve-node-version
      - test-node-ci
      - test-opentofu-validate
      - test-security-scan-fs
      - test-security-scan-image
    if: always()
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
