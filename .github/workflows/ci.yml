name: CI

# This repo's actual content is its workflow_call definitions - every file
# in workflows/ is a reusable workflow other repos consume, not something
# that runs here directly. actionlint validates that YAML/expression syntax
# (including workflow_call inputs/outputs) so a broken definition is caught
# here, not silently in every consuming repo's next run.

on:
  pull_request:
    branches: [main]

# No paths-ignore here on purpose: this workflow hosts required-checks-passed,
# which the org's branch ruleset requires by name on every PR. A path filter
# on the workflow trigger means GitHub never even starts the run for an
# excluded diff (e.g. a docs-only PR) -- not "skipped", just never reported --
# so the ruleset's required check sits at "Expected" forever and the PR can't
# merge. Filter what runs inside jobs (paths-filter, changed-files, etc.) if
# needed, never the trigger.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      - run: ./actionlint -color

  # Single stable name for the org's required-status-check ruleset to point
  # at, regardless of how the real jobs above are split or renamed.
  required-checks-passed:
    name: Required checks passed
    runs-on: ubuntu-latest
    needs: [actionlint]
    if: always()
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
