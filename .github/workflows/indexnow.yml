name: Submit to IndexNow

# Submits the sitemap's URLs to IndexNow (Bing, Yandex, Seznam, ...) after a
# deploy. continue-on-error so it can never fail a caller's deploy.

on:
  workflow_call:
    inputs:
      host:
        description: Hostname to submit, e.g. "eraser.drumandbytes.dev".
        required: true
        type: string
      key:
        description: IndexNow key; pass the org's INDEXNOW_KEY variable.
        required: true
        type: string
      runner:
        description: runs-on value.
        required: false
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  submit:
    name: IndexNow ${{ inputs.host }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - name: Submit sitemap URLs
        env:
          HOST: ${{ inputs.host }}
          KEY: ${{ inputs.key }}
        run: |
          set -euo pipefail

          # grep exits 1 on no match, which pipefail would turn into an abort.
          extract_locs() { { grep -o '<loc>[^<]*</loc>' || true; } | sed -E 's#</?loc>##g'; }

          # Retries: this runs right after the deploy, often before it's live.
          body=$(curl -sf --retry 5 --retry-delay 6 --retry-all-errors "https://${HOST}/sitemap.xml")
          locs=$(printf '%s' "$body" | extract_locs)

          if printf '%s' "$body" | grep -q '<sitemapindex'; then
            urls=""
            while IFS= read -r sm; do
              [ -z "$sm" ] && continue
              urls="$urls"$'\n'"$(curl -sf --retry 5 --retry-delay 6 --retry-all-errors "$sm" | extract_locs)"
            done <<< "$locs"
          else
            urls="$locs"
          fi

          url_list_json=$(printf '%s\n' "$urls" | jq -R . | jq -s 'map(select(. != "")) | unique')
          count=$(jq 'length' <<< "$url_list_json")
          if [ "$count" -eq 0 ]; then
            echo "::warning::IndexNow: no URLs found in https://${HOST}/sitemap.xml; nothing submitted."
            exit 0
          fi

          # IndexNow takes at most 10,000 URLs per request.
          failed=0
          while IFS= read -r batch; do
            n=$(jq 'length' <<< "$batch")
            payload=$(jq -n \
              --arg host "$HOST" \
              --arg key "$KEY" \
              --arg keyLocation "https://${HOST}/${KEY}.txt" \
              --argjson urlList "$batch" \
              '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')

            status=$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 \
              -X POST https://api.indexnow.org/IndexNow \
              -H 'Content-Type: application/json; charset=utf-8' \
              --data "$payload")

            echo "IndexNow: submitted $n URL(s) for $HOST — HTTP $status"
            case "$status" in
              200|202) ;;
              *) failed=1 ;;
            esac
          done < <(jq -c '. as $u | range(0; length; 10000) | $u[.:.+10000]' <<< "$url_list_json")

          echo "IndexNow: $count URL(s) total for $HOST"
          exit "$failed"
