name: Submit to IndexNow

# Tells IndexNow-participating engines (Bing, Yandex, Seznam, …) a site's
# sitemap changed, right after a deploy. The key is public by design --
# IndexNow's ownership proof is serving <key>.txt at the site root, not
# keeping the key secret -- so it's hardcoded here rather than threaded
# through every caller as a secret.
#
# continue-on-error lives here, not in each caller, so a submission failure
# can never turn into a failed deploy check no matter who calls this.

on:
  workflow_call:
    inputs:
      host:
        description: >-
          Hostname to submit, e.g. "eraser.drumandbytes.dev". Its
          /sitemap.xml is fetched (one level of sitemap-index expansion) and
          every <loc> submitted.
        required: true
        type: string

permissions:
  contents: read

jobs:
  submit:
    name: IndexNow ${{ inputs.host }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Submit sitemap URLs
        env:
          HOST: ${{ inputs.host }}
        run: |
          set -euo pipefail
          KEY="655f7wqht4d6f46nsf4ht25njqcyx5dx"

          extract_locs() { grep -o '<loc>[^<]*</loc>' | sed -E 's#</?loc>##g'; }

          body=$(curl -sf "https://${HOST}/sitemap.xml")
          locs=$(printf '%s' "$body" | extract_locs)

          if printf '%s' "$body" | grep -q '<sitemapindex'; then
            urls=""
            while IFS= read -r sm; do
              [ -z "$sm" ] && continue
              urls="$urls"$'\n'"$(curl -sf "$sm" | extract_locs)"
            done <<< "$locs"
          else
            urls="$locs"
          fi

          urls=$(printf '%s\n' "$urls" | grep -v '^$' | sort -u)
          count=$(printf '%s\n' "$urls" | grep -c .)
          url_list_json=$(printf '%s\n' "$urls" | jq -R . | jq -s .)

          payload=$(jq -n \
            --arg host "$HOST" \
            --arg key "$KEY" \
            --arg keyLocation "https://${HOST}/${KEY}.txt" \
            --argjson urlList "$url_list_json" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')

          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/IndexNow \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$payload")

          echo "IndexNow: submitted $count URL(s) for $HOST — HTTP $status"

          case "$status" in
            200|202) exit 0 ;;
            *) exit 1 ;;
          esac
