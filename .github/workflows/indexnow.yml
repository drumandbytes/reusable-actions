name: Submit to IndexNow

# Pings IndexNow (Bing, Yandex, Seznam, …) with the sitemap after a deploy.
# Key's not secret -- ownership proof is serving <key>.txt -- but callers
# pass it via INDEXNOW_KEY so rotation doesn't mean editing this file.
#
# continue-on-error lives here so no caller's deploy can fail because of us.

on:
  workflow_call:
    inputs:
      host:
        description: Hostname to submit, e.g. "eraser.drumandbytes.dev".
        required: true
        type: string
      key:
        description: IndexNow key -- pass the org's INDEXNOW_KEY variable.
        required: true
        type: string

permissions:
  contents: read

jobs:
  submit:
    name: IndexNow ${{ inputs.host }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Submit sitemap URLs
        env:
          HOST: ${{ inputs.host }}
          KEY: ${{ inputs.key }}
        run: |
          set -euo pipefail

          extract_locs() { grep -o '<loc>[^<]*</loc>' | sed -E 's#</?loc>##g'; }

          # --retry-all-errors: this job starts the instant the deploy job
          # reports done, which can be seconds ahead of the new deployment
          # actually being live at the edge -- a bare curl -sf here 404s/523s
          # more often than not.
          body=$(curl -sf --retry 5 --retry-delay 6 --retry-all-errors "https://${HOST}/sitemap.xml")
          locs=$(printf '%s' "$body" | extract_locs)

          if printf '%s' "$body" | grep -q '<sitemapindex'; then
            urls=""
            while IFS= read -r sm; do
              [ -z "$sm" ] && continue
              urls="$urls"$'\n'"$(curl -sf --retry 5 --retry-delay 6 --retry-all-errors "$sm" | extract_locs)"
            done <<< "$locs"
          else
            urls="$locs"
          fi

          urls=$(printf '%s\n' "$urls" | grep -v '^$' | sort -u)
          count=$(printf '%s\n' "$urls" | grep -c .)
          url_list_json=$(printf '%s\n' "$urls" | jq -R . | jq -s .)

          payload=$(jq -n \
            --arg host "$HOST" \
            --arg key "$KEY" \
            --arg keyLocation "https://${HOST}/${KEY}.txt" \
            --argjson urlList "$url_list_json" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')

          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/IndexNow \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data "$payload")

          echo "IndexNow: submitted $count URL(s) for $HOST — HTTP $status"

          case "$status" in
            200|202) exit 0 ;;
            *) exit 1 ;;
          esac
