name: Node CI

# Lint plus a per-package check matrix for repos holding several npm packages
# in subdirectories. Replaces the ci.yml files in road-conditions-ee and
# cloudflare-workers, which had the same shape (one root lint job, then one job
# per package running typecheck and tests) and differed only in package names
# and action versions.

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used for every job.
        required: false
        type: string
        default: "24"
      run-lint:
        description: Run the root-level lint job.
        required: false
        type: boolean
        default: true
      lint-directory:
        description: Directory the lint job installs and runs in.
        required: false
        type: string
        default: "."
      lint-command:
        description: Command the lint job runs.
        required: false
        type: string
        default: "npm run lint"
      package-manager:
        description: >-
          "npm" or "pnpm". pnpm workspaces need pnpm/action-setup before
          setup-node so the store can be cached, and use a different lockfile.
        required: false
        type: string
        default: "npm"
      packages:
        description: >-
          JSON array of {"directory": "...", "command": "..."} objects, one per
          package to check. Each entry gets its own job running `npm ci` in that
          directory followed by the given command, e.g.
          [{"directory":"api-worker","command":"npm run typecheck && npm test"}]
          An optional "name" overrides the job name, useful when several entries
          share a directory (e.g. a workspace root).
        required: false
        type: string
        default: "[]"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    if: inputs.run-lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.lint-directory }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve node version
        id: node
        # mise.toml is the source of truth for repos that have one, so a version
        # lives in exactly one place instead of being repeated in every workflow
        # that calls this. Falls back to the node-version input for the callers
        # that have no mise.toml -- most of them, so this must stay a fallback
        # rather than a requirement.
        run: |
          version="${{ inputs.node-version }}"
          for f in mise.toml .mise.toml; do
            if [ -f "$f" ]; then
              pinned=$(sed -nE 's/^[[:space:]]*node[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$f" | head -1)
              if [ -n "$pinned" ]; then
                version="$pinned"
                echo "Using node $version from $f"
              fi
              break
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        if: inputs.package-manager == 'pnpm'
      - uses: actions/setup-node@v7
        if: inputs.package-manager == 'pnpm'
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - if: inputs.package-manager == 'pnpm'
        working-directory: .
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-node@v7
        if: inputs.package-manager != 'pnpm'
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: ${{ inputs.lint-directory }}/package-lock.json
      - if: inputs.package-manager != 'pnpm'
        run: npm ci
      - run: ${{ inputs.lint-command }}

  check:
    name: ${{ matrix.package.name || matrix.package.directory }}
    # An empty packages array yields an empty matrix, which GitHub treats as an
    # error rather than a skip — so guard on it explicitly.
    if: inputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.packages) }}
    defaults:
      run:
        working-directory: ${{ matrix.package.directory }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve node version
        id: node
        # mise.toml is the source of truth for repos that have one, so a version
        # lives in exactly one place instead of being repeated in every workflow
        # that calls this. Falls back to the node-version input for the callers
        # that have no mise.toml -- most of them, so this must stay a fallback
        # rather than a requirement.
        run: |
          version="${{ inputs.node-version }}"
          for f in mise.toml .mise.toml; do
            if [ -f "$f" ]; then
              pinned=$(sed -nE 's/^[[:space:]]*node[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$f" | head -1)
              if [ -n "$pinned" ]; then
                version="$pinned"
                echo "Using node $version from $f"
              fi
              break
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@v6
        if: inputs.package-manager == 'pnpm'
      - uses: actions/setup-node@v7
        if: inputs.package-manager == 'pnpm'
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # pnpm workspaces keep one lockfile at the repo root and install every
      # workspace package from there, so this must not run in the package dir.
      - if: inputs.package-manager == 'pnpm'
        working-directory: .
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-node@v7
        if: inputs.package-manager != 'pnpm'
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: ${{ matrix.package.directory }}/package-lock.json
      - if: inputs.package-manager != 'pnpm'
        run: npm ci
      - run: ${{ matrix.package.command }}
