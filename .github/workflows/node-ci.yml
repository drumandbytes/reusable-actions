name: Node CI

# Lint plus a per-package check matrix for repos holding several npm packages
# in subdirectories. Replaces the ci.yml files in road-conditions-ee and
# cloudflare-workers, which had the same shape (one root lint job, then one job
# per package running typecheck and tests) and differed only in package names
# and action versions.

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used for every job.
        required: false
        type: string
        default: "24"
      run-lint:
        description: Run the root-level lint job.
        required: false
        type: boolean
        default: true
      lint-directory:
        description: Directory the lint job installs and runs in.
        required: false
        type: string
        default: "."
      lint-command:
        description: Command the lint job runs.
        required: false
        type: string
        default: "npm run lint"
      package-manager:
        description: >-
          "npm" or "pnpm". pnpm workspaces need pnpm/action-setup before
          setup-node so the store can be cached, and use a different lockfile.
        required: false
        type: string
        default: "npm"
      packages:
        description: >-
          JSON array of {"directory": "...", "command": "..."} objects, one per
          package to check. Each entry gets its own job running `npm ci` in that
          directory followed by the given command, e.g.
          [{"directory":"api-worker","command":"npm run typecheck && npm test"}]
          An optional "name" overrides the job name, useful when several entries
          share a directory (e.g. a workspace root).
        required: false
        type: string
        default: "[]"
      runner:
        description: runs-on value for every job in this workflow.
        required: false
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    if: inputs.run-lint
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ inputs.lint-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve node version
        id: node
        # mise.toml is the source of truth for repos that have one, so a version
        # lives in exactly one place instead of being repeated in every workflow
        # that calls this. Falls back to the node-version input for the callers
        # that have no mise.toml -- most of them, so this must stay a fallback
        # rather than a requirement.
        #
        # Walks from the working directory up to the repo root, nearest node pin
        # wins -- the way mise itself resolves config, so a single root
        # mise.toml covers packages and workers living in subdirectories.
        env:
          DEFAULT_NODE_VERSION: ${{ inputs.node-version }}
        run: |
          version="$DEFAULT_NODE_VERSION"
          dir="$PWD"
          while :; do
            for f in "$dir/mise.toml" "$dir/.mise.toml"; do
              [ -f "$f" ] || continue
              pinned=$(sed -nE 's/^[[:space:]]*node[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$f" | head -1)
              if [ -n "$pinned" ]; then
                version="$pinned"
                echo "Using node $version from ${f#"$GITHUB_WORKSPACE"/}"
                break 2
              fi
            done
            [ "$dir" = "$GITHUB_WORKSPACE" ] || [ "$dir" = / ] && break
            dir=$(dirname "$dir")
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: inputs.package-manager == 'pnpm'
      - uses: actions/setup-node@v7
        if: inputs.package-manager == 'pnpm'
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - if: inputs.package-manager == 'pnpm'
        working-directory: .
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-node@v7
        if: inputs.package-manager != 'pnpm'
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: ${{ inputs.lint-directory }}/package-lock.json
      - if: inputs.package-manager != 'pnpm'
        run: npm ci
      - run: ${{ inputs.lint-command }}  # zizmor: ignore[template-injection] -- caller-supplied input, by design

  check:
    name: ${{ matrix.package.name || matrix.package.directory }}
    # An empty packages array yields an empty matrix, which GitHub treats as an
    # error rather than a skip — so guard on it explicitly. Checks the parsed
    # array, not the raw string, so "[ ]" or a `|` block's trailing newline
    # still counts as empty.
    if: fromJSON(inputs.packages)[0] != null
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.packages) }}
    defaults:
      run:
        working-directory: ${{ matrix.package.directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve node version
        id: node
        # mise.toml is the source of truth for repos that have one, so a version
        # lives in exactly one place instead of being repeated in every workflow
        # that calls this. Falls back to the node-version input for the callers
        # that have no mise.toml -- most of them, so this must stay a fallback
        # rather than a requirement.
        #
        # Walks from the working directory up to the repo root, nearest node pin
        # wins -- the way mise itself resolves config, so a single root
        # mise.toml covers packages and workers living in subdirectories.
        env:
          DEFAULT_NODE_VERSION: ${{ inputs.node-version }}
        run: |
          version="$DEFAULT_NODE_VERSION"
          dir="$PWD"
          while :; do
            for f in "$dir/mise.toml" "$dir/.mise.toml"; do
              [ -f "$f" ] || continue
              pinned=$(sed -nE 's/^[[:space:]]*node[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$f" | head -1)
              if [ -n "$pinned" ]; then
                version="$pinned"
                echo "Using node $version from ${f#"$GITHUB_WORKSPACE"/}"
                break 2
              fi
            done
            [ "$dir" = "$GITHUB_WORKSPACE" ] || [ "$dir" = / ] && break
            dir=$(dirname "$dir")
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: inputs.package-manager == 'pnpm'
      - uses: actions/setup-node@v7
        if: inputs.package-manager == 'pnpm'
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      # pnpm workspaces keep one lockfile at the repo root and install every
      # workspace package from there, so this must not run in the package dir.
      - if: inputs.package-manager == 'pnpm'
        working-directory: .
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-node@v7
        if: inputs.package-manager != 'pnpm'
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: ${{ matrix.package.directory }}/package-lock.json
      - if: inputs.package-manager != 'pnpm'
        run: npm ci
      - run: ${{ matrix.package.command }}  # zizmor: ignore[template-injection] -- caller-supplied input, by design
