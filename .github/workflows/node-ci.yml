name: Node CI

# A root lint job plus one check job per package directory.

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version, unless mise.toml pins one.
        required: false
        type: string
        default: "24"
      run-lint:
        description: Run the lint job.
        required: false
        type: boolean
        default: true
      lint-directory:
        description: Directory the lint job runs in.
        required: false
        type: string
        default: "."
      lint-command:
        description: Lint command.
        required: false
        type: string
        default: "npm run lint"
      package-manager:
        description: '"npm" or "pnpm" (workspace, lockfile at the repo root).'
        required: false
        type: string
        default: "npm"
      packages:
        description: >-
          JSON array of {"directory", "command", optional "name"}, one job each,
          e.g. [{"directory":"api-worker","command":"npm run typecheck && npm test"}].
        required: false
        type: string
        default: "[]"
      runner:
        description: runs-on value.
        required: false
        type: string
        default: "ubuntu-latest"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    if: inputs.run-lint
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ inputs.lint-directory }}
    steps:
      - name: Validate package-manager
        working-directory: . # before checkout, lint-directory doesn't exist yet
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            npm|pnpm) ;;
            *) echo "::error::package-manager must be \"npm\" or \"pnpm\", got \"$PACKAGE_MANAGER\""; exit 1 ;;
          esac
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve node version
        id: node
        uses: $/.github/actions/resolve-node-version
        with:
          default: ${{ inputs.node-version }}
          working-directory: ${{ inputs.lint-directory }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: inputs.package-manager == 'pnpm'
      # No Actions cache on self-hosted runners: they keep their package cache
      # between runs, and restoring the cache there is slower than not.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: ${{ runner.environment != 'self-hosted' && inputs.package-manager || '' }}
          package-manager-cache: ${{ runner.environment != 'self-hosted' }}
          cache-dependency-path: ${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || format('{0}/package-lock.json', inputs.lint-directory) }}
      - if: inputs.package-manager == 'pnpm'
        working-directory: .
        run: pnpm install --frozen-lockfile
      - if: inputs.package-manager == 'npm'
        run: npm ci
      - run: ${{ inputs.lint-command }}  # zizmor: ignore[template-injection] -- caller-supplied input, by design

  check:
    name: ${{ matrix.package.name || matrix.package.directory }}
    # An empty matrix is an error, not a skip.
    if: fromJSON(inputs.packages)[0] != null
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.packages) }}
    defaults:
      run:
        working-directory: ${{ matrix.package.directory }}
    steps:
      - name: Validate package-manager
        working-directory: .
        env:
          PACKAGE_MANAGER: ${{ inputs.package-manager }}
        run: |
          case "$PACKAGE_MANAGER" in
            npm|pnpm) ;;
            *) echo "::error::package-manager must be \"npm\" or \"pnpm\", got \"$PACKAGE_MANAGER\""; exit 1 ;;
          esac
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve node version
        id: node
        uses: $/.github/actions/resolve-node-version
        with:
          default: ${{ inputs.node-version }}
          working-directory: ${{ matrix.package.directory }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: inputs.package-manager == 'pnpm'
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: ${{ runner.environment != 'self-hosted' && inputs.package-manager || '' }}
          package-manager-cache: ${{ runner.environment != 'self-hosted' }}
          cache-dependency-path: ${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || format('{0}/package-lock.json', matrix.package.directory) }}
      # pnpm workspaces install from the root lockfile.
      - if: inputs.package-manager == 'pnpm'
        working-directory: .
        run: pnpm install --frozen-lockfile
      - if: inputs.package-manager == 'npm'
        run: npm ci
      - run: ${{ matrix.package.command }}  # zizmor: ignore[template-injection] -- caller-supplied input, by design
