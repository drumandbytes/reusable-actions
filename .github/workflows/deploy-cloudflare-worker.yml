name: Deploy Cloudflare Worker

# Shared deploy for npm-based Cloudflare Workers living in a subdirectory of a
# repo. Replaces six near-identical per-worker workflows across
# cloudflare-workers and road-conditions-ee, which had drifted onto three
# different action version sets.
#
# Everything repo-specific (which directory, which worker) arrives as an input
# or secret from the caller, so this file stays generic.

on:
  workflow_call:
    inputs:
      working-directory:
        description: >-
          Directory containing the worker's wrangler config, package.json and
          package-lock.json, relative to the repo root (e.g. "api-worker").
        required: true
        type: string
      node-version:
        description: Node.js version used to install dependencies and run wrangler.
        required: false
        type: string
        default: "24"
      install-dependencies:
        description: >-
          Run `npm ci` before deploying. Set false for workers that have no
          package-lock.json and let wrangler bundle straight from source —
          `npm ci` hard-fails without a lockfile.
        required: false
        type: boolean
        default: true
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

# Deploying needs no write access to the repo itself — auth to Cloudflare is via
# the API token. Reusable workflows can only reduce the caller's permissions,
# never elevate them, so this is a floor rather than a grant.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.working-directory }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve node version
        id: node
        # mise.toml is the source of truth for repos that have one, so a version
        # lives in exactly one place instead of being repeated in every workflow
        # that calls this. Falls back to the node-version input for the callers
        # that have no mise.toml -- most of them, so this must stay a fallback
        # rather than a requirement.
        run: |
          version="${{ inputs.node-version }}"
          for f in mise.toml .mise.toml; do
            if [ -f "$f" ]; then
              pinned=$(sed -nE 's/^[[:space:]]*node[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$f" | head -1)
              if [ -n "$pinned" ]; then
                version="$pinned"
                echo "Using node $version from $f"
              fi
              break
            fi
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: inputs.install-dependencies
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - if: inputs.install-dependencies
        run: npm ci

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ inputs.working-directory }}
