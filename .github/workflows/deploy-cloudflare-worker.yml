name: Deploy Cloudflare Worker

# Shared deploy for npm-based Cloudflare Workers living in a subdirectory of a
# repo. Replaces six near-identical per-worker workflows across
# cloudflare-workers and road-conditions-ee, which had drifted onto three
# different action version sets.
#
# Everything repo-specific (which directory, which worker) arrives as an input
# or secret from the caller, so this file stays generic.

on:
  workflow_call:
    inputs:
      working-directory:
        description: >-
          Directory containing the worker's wrangler config, package.json and
          package-lock.json, relative to the repo root (e.g. "api-worker").
        required: true
        type: string
      node-version:
        description: Node.js version used to install dependencies and run wrangler.
        required: false
        type: string
        default: "24"
      install-dependencies:
        description: >-
          Run `npm ci` before deploying. Set false for workers that have no
          package-lock.json and let wrangler bundle straight from source —
          `npm ci` hard-fails without a lockfile.
        required: false
        type: boolean
        default: true
      runner:
        description: runs-on value for this workflow's job.
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

# Deploying needs no write access to the repo itself — auth to Cloudflare is via
# the API token. Reusable workflows can only reduce the caller's permissions,
# never elevate them, so this is a floor rather than a grant.
permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.working-directory }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    # Two quick merges would otherwise deploy side by side, and whichever
    # finishes last stays live -- possibly the older one. Queue per target and
    # ref instead: cancel-in-progress stays false so a deploy is never cut off
    # halfway, and GitHub keeps only the newest pending run. The ref keeps a
    # preview deploy from displacing a queued production one.
    concurrency:
      group: cloudflare-worker-deploy-${{ inputs.working-directory }}-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve node version
        id: node
        # mise.toml is the source of truth for repos that have one, so a version
        # lives in exactly one place instead of being repeated in every workflow
        # that calls this. Falls back to the node-version input for the callers
        # that have no mise.toml -- most of them, so this must stay a fallback
        # rather than a requirement.
        #
        # Walks from the working directory up to the repo root, nearest node pin
        # wins -- the way mise itself resolves config, so a single root
        # mise.toml covers packages and workers living in subdirectories.
        env:
          DEFAULT_NODE_VERSION: ${{ inputs.node-version }}
        run: |
          version="$DEFAULT_NODE_VERSION"
          dir="$PWD"
          while :; do
            for f in "$dir/mise.toml" "$dir/.mise.toml"; do
              [ -f "$f" ] || continue
              pinned=$(sed -nE 's/^[[:space:]]*node[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$f" | head -1)
              if [ -n "$pinned" ]; then
                version="$pinned"
                echo "Using node $version from ${f#"$GITHUB_WORKSPACE"/}"
                break 2
              fi
            done
            [ "$dir" = "$GITHUB_WORKSPACE" ] || [ "$dir" = / ] && break
            dir=$(dirname "$dir")
          done
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: inputs.install-dependencies
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      - if: inputs.install-dependencies
        run: npm ci

      - uses: cloudflare/wrangler-action@25853364521e0d392ece9b0c1e97a4b37b638087 # v4.1.2
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ inputs.working-directory }}
