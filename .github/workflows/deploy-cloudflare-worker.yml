name: Deploy Cloudflare Worker

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the worker's wrangler config, e.g. "api-worker".
        required: true
        type: string
      node-version:
        description: Node.js version, unless mise.toml pins one.
        required: false
        type: string
        default: "24"
      install-dependencies:
        description: Run `npm ci` first. Set false when there's no package-lock.json.
        required: false
        type: boolean
        default: true
      runner:
        description: runs-on value.
        required: false
        type: string
        default: "ubuntu-latest"
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.working-directory }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    # Queue rather than cancel, so an older deploy can't finish last and win.
    concurrency:
      group: cloudflare-worker-deploy-${{ inputs.working-directory }}-${{ github.ref }}
      cancel-in-progress: false
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Resolve node version
        id: node
        uses: $/.github/actions/resolve-node-version
        with:
          default: ${{ inputs.node-version }}
          working-directory: ${{ inputs.working-directory }}

      # No Actions cache on self-hosted runners: they keep ~/.npm between runs,
      # and restoring the cache there is slower than not.
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: ${{ inputs.install-dependencies && runner.environment != 'self-hosted' && 'npm' || '' }}
          package-manager-cache: ${{ runner.environment != 'self-hosted' }}
          cache-dependency-path: ${{ inputs.install-dependencies && format('{0}/package-lock.json', inputs.working-directory) || '' }}

      - if: inputs.install-dependencies
        run: npm ci

      - uses: cloudflare/wrangler-action@25853364521e0d392ece9b0c1e97a4b37b638087 # v4.1.2
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ inputs.working-directory }}
