name: Python action CI

# Lint, tests and structural checks for a GitHub Action written in Python.

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used for lint and tests.
        required: false
        type: string
        default: "3.12"
      ruff-version:
        description: >-
          ruff version. Pinned so a new formatter style can't fail every caller
          at once.
        required: false
        type: string
        default: "0.16.8"
      lint-paths:
        description: Space-separated paths passed to ruff.
        required: false
        type: string
        default: ".github/scripts/"
      test-dependencies:
        description: Space-separated pip requirements for the tests, e.g. "pytest pyyaml".
        required: true
        type: string
      test-command:
        description: Test command.
        required: false
        type: string
        default: "pytest tests/ -v"
      required-files:
        description: Newline-separated paths that must exist.
        required: false
        type: string
        default: "action.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - run: pip install "ruff==${RUFF_VERSION}"
        env:
          RUFF_VERSION: ${{ inputs.ruff-version }}
      - run: ruff check ${{ inputs.lint-paths }}  # zizmor: ignore[template-injection] -- caller-supplied input, by design
      - run: ruff format --check ${{ inputs.lint-paths }}  # zizmor: ignore[template-injection] -- caller-supplied input, by design

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - run: pip install ${{ inputs.test-dependencies }}  # zizmor: ignore[template-injection] -- caller-supplied input, by design
      - run: ${{ inputs.test-command }}  # zizmor: ignore[template-injection] -- caller-supplied input, by design

  validate-action:
    name: Validate action
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - run: pip install pyyaml
      - name: Validate action.yml is parseable YAML
        shell: python
        run: |
          import os, sys, yaml
          found = [f for f in ("action.yml", "action.yaml") if os.path.exists(f)]
          if not found:
              print("::error::no action.yml or action.yaml at the repository root")
              sys.exit(1)
          yaml.safe_load(open(found[0]))
          print(f"{found[0]} is valid YAML")
      - name: Check required files exist
        env:
          REQUIRED_FILES: ${{ inputs.required-files }}
        run: |
          status=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ -e "$f" ]; then
              echo "ok      $f"
            else
              echo "MISSING $f"
              status=1
            fi
          done <<< "$REQUIRED_FILES"
          exit $status
