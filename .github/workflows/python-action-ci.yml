name: Python action CI

# Lint, test and structural checks for a repository that ships a GitHub Action
# implemented in Python. Replaces the near-identical ci.yml files in
# argocd-gitops-updater-action and opentofu-updater-action, which differed only
# in their dependency lists, script paths and required-file checks.

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used for lint and tests.
        required: false
        type: string
        default: "3.12"
      lint-paths:
        description: Space-separated paths passed to ruff.
        required: false
        type: string
        default: ".github/scripts/"
      test-dependencies:
        description: >-
          Space-separated pip requirements installed before running tests, e.g.
          "pytest pytest-asyncio pyyaml". Quote specifiers that contain
          shell-significant characters.
        required: true
        type: string
      test-command:
        description: Command used to run the test suite.
        required: false
        type: string
        default: "pytest tests/ -v"
      required-files:
        description: >-
          Newline-separated paths that must exist in the repository. Catches a
          renamed or deleted script that tests alone would not notice.
        required: false
        type: string
        default: "action.yml"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - run: pip install ruff
      - run: ruff check ${{ inputs.lint-paths }}  # zizmor: ignore[template-injection] -- caller-supplied input, by design
      - run: ruff format --check ${{ inputs.lint-paths }}  # zizmor: ignore[template-injection] -- caller-supplied input, by design

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      - run: pip install ${{ inputs.test-dependencies }}  # zizmor: ignore[template-injection] -- caller-supplied input, by design
      - run: ${{ inputs.test-command }}  # zizmor: ignore[template-injection] -- caller-supplied input, by design

  validate-action:
    name: Validate action
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
      # setup-python provides a clean interpreter, unlike the runner's system
      # Python which ships PyYAML — so install it explicitly rather than
      # depending on whatever the image happens to preinstall.
      - run: pip install pyyaml
      # GitHub accepts either spelling for the action metadata file.
      - name: Validate action.yml is parseable YAML
        shell: python
        run: |
          import os, sys, yaml
          found = [f for f in ("action.yml", "action.yaml") if os.path.exists(f)]
          if not found:
              print("::error::no action.yml or action.yaml at the repository root")
              sys.exit(1)
          yaml.safe_load(open(found[0]))
          print(f"{found[0]} is valid YAML")
      - name: Check required files exist
        env:
          REQUIRED_FILES: ${{ inputs.required-files }}
        run: |
          status=0
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if [ -e "$f" ]; then
              echo "ok      $f"
            else
              echo "MISSING $f"
              status=1
            fi
          done <<< "$REQUIRED_FILES"
          exit $status
