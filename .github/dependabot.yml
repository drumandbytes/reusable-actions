version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Week-old releases only: a hijacked one is usually pulled within days,
    # before auto-merge spreads it to every caller.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    # `fix(deps):` so release-please folds each bump into a patch release.
    commit-message:
      prefix: "fix"
      include: "scope"
