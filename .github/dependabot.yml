version: 2
updates:

  # Grouped into a single PR so related action bumps land together rather than
  # as a stream of separate PRs. Auto-merge handles them once CI passes.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Only offer releases at least a week old. A hijacked or broken release is
    # usually caught and pulled within days; this keeps it from landing here
    # (and, via auto-merge, in every caller) before that happens.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    # `fix(deps):` so release-please folds each bump into a patch release.
    commit-message:
      prefix: "fix"
      include: "scope"
